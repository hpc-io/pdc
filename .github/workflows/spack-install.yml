name: Spack Installation

on:
  pull_request:
    branches:
      - develop
      - stable
  push:
    branches:
      - develop
      - stable
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spack-install-and-test:
    name: Spack Install + Test (Ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout PDC
        uses: actions/checkout@v4

      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          buildcache: true

      - name: Pick the pdc@<version> this PR builds against
        id: ver
        run: |
          # The pdc Spack recipe only knows two git-based versions,
          # "develop" and "stable" (see its version(..., branch=...)
          # entries) -- pick whichever one matches where this change is
          # headed, so version-gated bits of the recipe (e.g. the
          # mercury@2.2.0, when="@0.4:" pin) resolve the same way they
          # would for a real install of that branch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target="${{ github.base_ref }}"
          else
            target="${{ github.ref_name }}"
          fi
          if [ "$target" = "stable" ]; then
            echo "version=stable" >> "$GITHUB_OUTPUT"
          else
            echo "version=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PDC from this PR via Spack
        run: |
          # "spack install pdc@develop" (or plain --only dependencies, as
          # this workflow used to do) would fetch the pdc recipe's own
          # pinned develop/stable branch from GitHub, never touching this
          # PR's actual changes -- the one thing issue #235 asked this
          # workflow to cover. "spack dev-build -d <path>" builds the
          # exact same recipe (same cmake_args(), same dependency
          # versions/variants) but takes the package's source from <path>
          # instead of fetching it, so it builds this checkout.
          spack dev-build -d "$GITHUB_WORKSPACE" \
            pdc@${{ steps.ver.outputs.version }} \
            ^libfabric fabrics=sockets,tcp,udp,rxm

      - name: Capture Spack environment
        run: |
          spack load --sh openmpi libfabric mercury boost \
            > $GITHUB_WORKSPACE/spack-env.sh
          echo "export CPATH=$(spack location -i boost)/include:\$CPATH" \
            >> $GITHUB_WORKSPACE/spack-env.sh
          echo "=== spack-env.sh ==="
          cat $GITHUB_WORKSPACE/spack-env.sh

      - name: Run serial tests
        run: |
          source $GITHUB_WORKSPACE/spack-env.sh
          # spack dev-build builds out-of-source into
          # <source dir>/spack-build-<hash>/ (the hash depends on the
          # concretized spec, so it isn't known ahead of time).
          build_dir=$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name CMakeCache.txt | head -1)")
          if [ -z "$build_dir" ] || [ ! -d "$build_dir" ]; then
            echo "Could not locate the spack dev-build build directory under $GITHUB_WORKSPACE" >&2
            exit 1
          fi
          echo "Using Spack dev-build directory: $build_dir"
          cd "$build_dir"
          ctest -L serial --output-on-failure
